# Gruvbox Dark palette for catppuccin/tmux v2
# Drop this file into:
#   ~/.config/tmux/plugins/catppuccin/tmux/themes/catppuccin_gruvbox.tmuxtheme
# Then set: set -g @catppuccin_flavor 'gruvbox'

# ── Backgrounds ────────────────────────────────────────────────────────────────
set -g @thm_bg         "#282828"   # bg  (main background)
set -g @thm_base       "#282828"   # bg
# set -g @thm_mantle     "#242424"   # bg  (slightly darker)
set -g @thm_mantle     "#282828"   # bg  (slightly darker)
set -g @thm_crust      "#1d2021"   # bg0_hard (darkest)

# ── Surfaces (inactive UI chrome) ─────────────────────────────────────────────
set -g @thm_surface_0  "#3c3836"   # bg1
set -g @thm_surface_1  "#504945"   # bg2
set -g @thm_surface_2  "#665c54"   # bg3

# ── Overlays (muted / secondary text) ─────────────────────────────────────────
set -g @thm_overlay_0  "#7c6f64"   # bg4
set -g @thm_overlay_1  "#928374"   # gray (neutral)
# set -g @thm_overlay_2  "#a89984"   # fg4  (dimmed foreground)
set -g @thm_overlay_2  "#83a598"   # fg4  (dimmed foreground)

# ── Foreground ─────────────────────────────────────────────────────────────────
set -g @thm_fg         "#ebdbb2"   # fg1
set -g @thm_subtext_1  "#d5c4a1"   # fg2
set -g @thm_subtext_0  "#bdae93"   # fg3

# ── Accent colours ─────────────────────────────────────────────────────────────
# These names follow catppuccin conventions so the plugin's internal references
# keep working.  The values are mapped to the nearest gruvbox equivalent.

set -g @thm_rosewater  "#ebdbb2"   # fg  (warm white)
# set -g @thm_flamingo   "#d3869b"   # bright purple
# set -g @thm_pink       "#d3869b"   # bright purple
# set -g @thm_mauve      "#d3869b"   # bright purple  ← active-window highlight
set -g @thm_flamingo   "#fe8019"   # bright purple
set -g @thm_pink       "#fe8019"   # bright purple
set -g @thm_mauve      "#fe8019"   # bright purple  ← active-window highlight
set -g @thm_lavender   "#83a598"   # bright blue    ← active-pane border

set -g @thm_red        "#fb4934"   # bright red
set -g @thm_maroon     "#cc241d"   # red
set -g @thm_peach      "#fe8019"   # bright orange
set -g @thm_yellow     "#fabd2f"   # bright yellow
set -g @thm_green      "#b8bb26"   # bright green
set -g @thm_teal       "#689d6a"   # aqua
set -g @thm_sky        "#8ec07c"   # bright aqua
set -g @thm_sapphire   "#83a598"   # blue
set -g @thm_blue       "#83a598"   # bright blue
set -g @thm_cyan       "#83a598"   # bright blue (alias)
